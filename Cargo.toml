[package]
name = "cmatrix"
version = "2.0.0"
edition = "2021"
description = "Rust port of cmatrix for the Windows terminal"
license = "GPL-3.0-or-later"

[dependencies]
crossterm = "0.28"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"